<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;color:var(--foreground);font-family:var(--font-sans)}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}button{font:inherit;font-size:13px;padding:6px 11px;border:1px solid var(--border);border-radius:var(--radius);background:transparent;color:var(--muted-foreground);cursor:pointer}button[aria-pressed=true]{color:var(--foreground);border-color:var(--chart-1);background:var(--secondary)}.legend{display:flex;gap:18px;font-size:12px;flex-wrap:wrap}.legend span{display:flex;align-items:center;gap:5px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block}.chart{height:228px;width:100%;display:block}.detail{font-size:13px;line-height:1.5;min-height:40px}.note{font-size:12px;color:var(--muted-foreground);line-height:1.5;margin-top:10px}.axis{fill:var(--muted-foreground);font-size:12px}.grid{stroke:var(--border);stroke-width:1}.point{cursor:pointer}.point:focus{outline:none;stroke:var(--foreground);stroke-width:3}
</style></head><body>
<div class="controls"><button id="throughput" aria-pressed="true">Request throughput</button><button id="acceptance" aria-pressed="false">Draft acceptance</button></div>
<div class="legend"><span><i class="dot" style="background:var(--chart-1)"></i>HE4broad</span><span><i class="dot" style="background:var(--chart-2)"></i>External Q4</span><span id="targetLegend"><i class="dot" style="background:var(--chart-3)"></i>Target only</span></div>
<svg class="chart" viewBox="0 0 680 228" role="img" aria-label="HE4broad performance over training hours"></svg>
<div class="detail" id="detail" aria-live="polite"></div>
<div class="note">Training hours include data I/O; setup, checkpointing and native evaluation are separate.<br>Three consumed DEV prompts, five measured repetitions per cell. All outputs correct. Snapshot through hour 5; the 60-second smoke uses a different output cap and is excluded.</div>
<script>
const rows=[{"hour":0,"acceptance":3.185840707964602,"q4_acceptance":65.32567049808429,"he4":127.54584822433479,"q4":247.39789395607272,"target":184.00235389369524,"correct":true,"ratio":{"ratio":0.5155494502591904,"paired_95_interval":[0.5118428465004167,0.5186955827346752],"draws":2000,"scope":"Paired complete prompts and process-cell repetitions; consumed/heldout cohort per source panel. Repeated greedy quality observations are not fresh samples or training seeds."}},{"hour":1,"acceptance":27.05128205128205,"q4_acceptance":65.32567049808429,"he4":179.43818399966298,"q4":248.2428698786734,"target":184.81847428575617,"correct":true,"ratio":{"ratio":0.7228331838387216,"paired_95_interval":[0.7188558030419081,0.7281090299621598],"draws":2000,"scope":"Paired complete prompts and process-cell repetitions; consumed/heldout cohort per source panel. Repeated greedy quality observations are not fresh samples or training seeds."}},{"hour":2,"acceptance":28.871391076115486,"q4_acceptance":65.32567049808429,"he4":183.02698276935638,"q4":249.5621671226802,"target":184.74547447784636,"correct":true,"ratio":{"ratio":0.7333923441984844,"paired_95_interval":[0.7325663230934286,0.7339182377891731],"draws":2000,"scope":"Paired complete prompts and process-cell repetitions; consumed/heldout cohort per source panel. Repeated greedy quality observations are not fresh samples or training seeds."}},{"hour":3,"acceptance":31.25845737483085,"q4_acceptance":65.32567049808429,"he4":187.44341774182666,"q4":249.63740688531269,"target":184.69602028013512,"correct":true,"ratio":{"ratio":0.7508627015499367,"paired_95_interval":[0.7485959308770134,0.7531315641391535],"draws":2000,"scope":"Paired complete prompts and process-cell repetitions; consumed/heldout cohort per source panel. Repeated greedy quality observations are not fresh samples or training seeds."}},{"hour":4,"acceptance":31.700680272108844,"q4_acceptance":65.32567049808429,"he4":187.43913664937205,"q4":249.02959606033144,"target":185.4014348307759,"correct":true,"ratio":{"ratio":0.7526781539811914,"paired_95_interval":[0.7475276818245744,0.7577199078375916],"draws":2000,"scope":"Paired complete prompts and process-cell repetitions; consumed/heldout cohort per source panel. Repeated greedy quality observations are not fresh samples or training seeds."}},{"hour":5,"acceptance":32.55494505494506,"q4_acceptance":65.32567049808429,"he4":189.17484853108584,"q4":249.2384542493493,"target":185.17535071395073,"correct":true,"ratio":{"ratio":0.7590114819995909,"paired_95_interval":[0.7524346647810152,0.7657142907375382],"draws":2000,"scope":"Paired complete prompts and process-cell repetitions; consumed/heldout cohort per source panel. Repeated greedy quality observations are not fresh samples or training seeds."}}];let mode="throughput",selected=5;const svg=document.querySelector("svg");
const ns="http://www.w3.org/2000/svg";
function add(tag,attrs,text){const el=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,v);if(text!==undefined)el.textContent=text;svg.appendChild(el);return el}
function select(i){selected=i;const r=rows[i];document.getElementById("detail").textContent=mode==="throughput"?"Hour "+r.hour+" · HE4broad "+r.he4.toFixed(1)+" · Q4 "+r.q4.toFixed(1)+" · target "+r.target.toFixed(1)+" tokens/s":"Hour "+r.hour+" · HE4broad "+r.acceptance.toFixed(1)+"% · Q4 "+r.q4_acceptance.toFixed(1)+"%";}
function draw(){svg.replaceChildren();const top=18,bottom=183,left=44,right=662,max=mode==="throughput"?280:70;const x=h=>left+(right-left)*h/5,y=v=>bottom-(bottom-top)*v/max;
[0,1,2,3,4].forEach(i=>{const value=max*i/4;add("line",{x1:left,y1:y(value),x2:right,y2:y(value),class:"grid"});add("text",{x:left-9,y:y(value)+4,"text-anchor":"end",class:"axis"},Math.round(value)+(mode==="acceptance"?"%":""))});
rows.forEach(r=>add("text",{x:x(r.hour),y:203,"text-anchor":"middle",class:"axis"},r.hour));
add("text",{x:(left+right)/2,y:224,"text-anchor":"middle",class:"axis"},"Training hours (including data I/O)");
const series=mode==="throughput"?[["he4","--chart-1"],["q4","--chart-2"],["target","--chart-3"]]:[["acceptance","--chart-1"],["q4_acceptance","--chart-2"]];
for(const [key,color] of series){add("polyline",{points:rows.map(r=>x(r.hour)+","+y(r[key])).join(" "),fill:"none",stroke:"var("+color+")","stroke-width":2.5});rows.forEach((r,i)=>{const c=add("circle",{cx:x(r.hour),cy:y(r[key]),r:4.5,fill:"var("+color+")",class:"point",tabindex:0,"aria-label":"Hour "+r.hour+": "+r[key].toFixed(1)});c.addEventListener("mouseenter",()=>select(i));c.addEventListener("focus",()=>select(i));c.addEventListener("click",()=>select(i));})}
document.getElementById("targetLegend").style.display=mode==="throughput"?"flex":"none";select(selected)}
for(const id of ["throughput","acceptance"])document.getElementById(id).onclick=()=>{mode=id;for(const a of ["throughput","acceptance"])document.getElementById(a).setAttribute("aria-pressed",a===mode);draw()};draw();
</script></body></html>
