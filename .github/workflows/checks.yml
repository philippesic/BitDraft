name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: docker build -f Dockerfile.checks -t binary-eagle-checks .
      - run: docker run --rm --network none -v "$PWD/.git:/foundation/.git:ro" binary-eagle-checks uv run --locked --no-sync --offline python tools/check.py
